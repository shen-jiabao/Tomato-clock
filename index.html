<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>番茄钟</h1>
        </header>

        <main>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="work">专注</button>
                <button class="mode-btn" data-mode="shortBreak">短休息</button>
                <button class="mode-btn" data-mode="longBreak">长休息</button>
            </div>

            <div class="mode-label" id="modeLabel">工作时间</div>

            <div class="timer-display">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                    <circle class="progress-ring-progress" cx="100" cy="100" r="90"/>
                </svg>
                <div class="time-text">
                    <span id="minutes">25</span>:<span id="seconds">00</span>
                </div>
            </div>

            <div class="controls">
                <button id="startPauseBtn" class="btn-primary">开始</button>
                <button id="resetBtn" class="btn-secondary">重置</button>
            </div>

            <div class="pomodoro-counter">
                <div class="pomodoro-dots" id="pomodoroDots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <p>已完成 <span id="completedCount">0</span> 个番茄钟</p>
            </div>
        </main>

        <aside class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2>⚙️ 设置</h2>
                <button id="closeSettings" class="close-btn">&times;</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="workTime">专注时长 (分钟)</label>
                    <input type="number" id="workTime" min="1" max="60" value="25">
                </div>
                <div class="setting-item">
                    <label for="shortBreakTime">短休息 (分钟)</label>
                    <input type="number" id="shortBreakTime" min="1" max="30" value="5">
                </div>
                <div class="setting-item">
                    <label for="longBreakTime">长休息 (分钟)</label>
                    <input type="number" id="longBreakTime" min="1" max="60" value="15">
                </div>
                <div class="setting-item">
                    <label for="pomodorosBeforeLongBreak">长休息前的番茄数</label>
                    <input type="number" id="pomodorosBeforeLongBreak" min="1" max="10" value="4">
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="autoStartBreaks" checked>
                        自动开始休息
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="soundEnabled" checked>
                        启用提示音
                    </label>
                </div>
                <button id="saveSettings" class="btn-primary">保存设置</button>
            </div>
        </aside>

        <button id="openSettings" class="settings-toggle">⚙️</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
